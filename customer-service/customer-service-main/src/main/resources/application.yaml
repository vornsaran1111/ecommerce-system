#customer service running port (payment-service uses 8551)
server:
  port: 8552
  forward-headers-strategy: framework
spring:
  application:
    name: customer-service
  profiles:
    active: dev
  config:
    import:
      - nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}
  cloud:
    nacos:
      config:
        file-extension: yaml
        namespace: ${spring.profiles.active}
      discovery:
        namespace: ${spring.profiles.active}
      username: nacos
      password: Saran@1111
      server-addr: 127.0.0.1:8848
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ecommerce_user
    password: ecommerce_pass
    url: jdbc:postgresql://localhost:8432/db_customer
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true