#change order service running port
server:
  port: 0
spring:
  application:
    name: order-service
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        namespace: ${spring.profiles.active}
      username: nacos
      password: Saran@1111
      server-addr: 127.0.0.1:8848

  datasource:
    driver-class-name: org.postgresql.Driver
    username: ecommerce_user
    password: ecommerce_pass
    url: jdbc:postgresql://localhost:8432/db_order
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true